name: Release

# A v* tag builds the release APK, signs it with the app-signing key shared
# with Google Play, and attaches it to a GitHub Release. Built without
# Firebase: no google-services.json exists here (see docs/distribution.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Environment secrets, so the signing key can sit behind the
    # environment's protection rules:
    #   JOLT_RELEASE_KEYSTORE           base64 of the app-signing keystore
    #   JOLT_RELEASE_KEYSTORE_PASSWORD  its store password
    #   JOLT_RELEASE_KEY_ALIAS          the key alias
    #   JOLT_RELEASE_KEY_PASSWORD       the key password
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          # The version code is the commit count, so all of history is needed.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.JOLT_RELEASE_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::The release environment has no JOLT_RELEASE_KEYSTORE secret; see docs/distribution.md."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build the release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.JOLT_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.JOLT_RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.JOLT_RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_JOLT_DEFAULT_SERVER_URL: ${{ vars.JOLT_DEFAULT_SERVER_URL }}
          ORG_GRADLE_PROJECT_JOLT_RELAY_ALLOWED_HOSTS: ${{ vars.JOLT_RELAY_ALLOWED_HOSTS }}
        run: |
          VERSION_CODE="$(git rev-list --count HEAD)"
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [ -z "$ORG_GRADLE_PROJECT_JOLT_DEFAULT_SERVER_URL" ]; then unset ORG_GRADLE_PROJECT_JOLT_DEFAULT_SERVER_URL; fi
          ./gradlew assembleRelease \
            -Pandroid.injected.version.code="$VERSION_CODE" \
            -Pandroid.injected.version.name="$VERSION_NAME"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/jolt-$VERSION_NAME.apk"
          (cd dist && sha256sum "jolt-$VERSION_NAME.apk" > "jolt-$VERSION_NAME.apk.sha256")
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "dist/jolt-$VERSION_NAME.apk" \
            | grep -E "SHA-256 digest" > dist/signing-certificate.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Signed APK built from this tag, without Firebase (no push notifications)."
            echo
            echo "Signing certificate:"
            echo '```'
            cat dist/signing-certificate.txt
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/*.sha256 \
            --verify-tag --generate-notes --notes-file "$RUNNER_TEMP/notes.md"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
