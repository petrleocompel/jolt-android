org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Build-time configuration. Each value can be overridden with -P on the
# command line or an ORG_GRADLE_PROJECT_<name> environment variable in CI.
# Never put a real host or credential here; this file is committed.

# Server a fresh install points at (iOS: JOLT_DEFAULT_SERVER_URL).
JOLT_DEFAULT_SERVER_URL=https://jolt.example.com/api/v1
# Comma-separated relay hosts the app may register with. Empty trusts none.
JOLT_RELAY_ALLOWED_HOSTS=
# Google Cloud project number for Play Integrity. 0 skips attestation.
JOLT_PLAY_INTEGRITY_CLOUD_PROJECT=0
